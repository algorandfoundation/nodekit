## This is a temporary flow, until we have our custom docker images that work with systemd for linux.
## Once we have that, we can remove this and use docker containers in parallel, covering the various OS:es.

name: Node Command OS-Matrix Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/algod/logs/**"

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Run Ubuntu commands
        run: |
          export GOCOVERDIR=$(pwd)/coverage
          mkdir -p $GOCOVERDIR
          go build -cover .
          ./nodekit install
          systemctl status algorand.service
          export TOKEN=$(cat /var/lib/algorand/algod.admin.token)
          curl http://localhost:8080/v2/participation -H "X-Algo-API-Token: $TOKEN" | grep "null"
          ./nodekit stop
          ./nodekit upgrade
          ./nodekit debug
          sudo -E ./nodekit logs --lines 20
          sudo -E ./nodekit logs --all --lines 5 --json
          sudo -E ./nodekit logs --since 1h --lines 5
          # The data directory is owned by the algorand user, so an unprivileged
          # read must fail with a readable message rather than a panic. Only the
          # message separates the two, since a panic exits non-zero as well.
          if ./nodekit logs --lines 5 > unprivileged.out 2>&1; then
            echo "note: the log was readable without sudo on this runner"
          else
            grep -q "permission denied" unprivileged.out || {
              echo "expected a permission-denied message, got:"; cat unprivileged.out; exit 1; }
          fi
          sleep 10
          ./nodekit catchup
          ./nodekit catchup debug
          ./nodekit catchup stop
          ./nodekit stop
          sudo -E ./nodekit logs --lines 5
          ./nodekit uninstall
          go tool covdata textfmt -i=$GOCOVERDIR -o coverage.txt
          
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Go
        run: brew install go

      - name: Run MacOs commands
        run: |
          export GOCOVERDIR=$(pwd)/coverage
          mkdir -p $GOCOVERDIR
          go build -cover .
          ./nodekit install
          sudo launchctl print system/com.algorand.algod
          sleep 5
          export TOKEN=$(cat ~/.algorand/algod.admin.token)
          curl http://localhost:8080/v2/participation -H "X-Algo-API-Token: $TOKEN" | grep "null"
          ./nodekit stop
          ./nodekit upgrade
          ./nodekit debug
          ./nodekit logs --lines 20
          ./nodekit logs --all --lines 5 --json
          ./nodekit logs --since 1h --lines 5
          sleep 10
          ./nodekit catchup
          ./nodekit catchup debug
          ./nodekit catchup stop
          ./nodekit stop
          ./nodekit logs --lines 5
          ./nodekit uninstall
          go tool covdata textfmt -i=$GOCOVERDIR -o coverage.txt
          
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
