package: api
output: api/lf.go
generate:
  models: true
  client: true
  embedded-spec: false
output-options:
  client-type-name: Algod
  # See codegen-overlay.yaml for why this is needed.
  overlay:
    path: codegen-overlay.yaml
    # Older specs (<= v3.26.0-stable) carry no x-go-type at all, and a strict
    # overlay fails when an action matches nothing.
    strict: false
  include-operation-ids:
    - Metrics
    - GetStatus
    - WaitForBlock
    - GetVersion
    - GetParticipationKeys
    - AddParticipationKey
    - GenerateParticipationKeys
    - DeleteParticipationKeyByID
    - GetParticipationKeyByID
    - AppendKeys
    - GetBlock
    - AccountInformation
    - GetGenesis
    - StartCatchup
    - AbortCatchup
