- name: Test Instance
  hosts: localhost
  tasks:
    - name: Ensure nodekit exists
      stat:
        path: /usr/bin/nodekit
      register: binpath
    - name: Fail missing binary
      fail:
        msg: "Must have nodekit installed!"
      when: not binpath.stat.exists
    - name: Run installer
      command: nodekit install
    - name: Run stop
      command: nodekit stop
    - name: Run upgrade
      command: nodekit upgrade
    - name: Run stop
      command: nodekit stop
    - name: Run Start
      command: nodekit start
      # Realized by tools/statewalker: `statewalker stage demo|e2e|journey`
      # starts a private network, funds accounts and drives TUI-observable
      # states end to end (see tools/statewalker/README.md).